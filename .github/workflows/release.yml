name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11.24.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tirox-ui/docs exec playwright install --with-deps chromium firefox webkit
      - run: pnpm release:check

      - name: Publish @tirox-ui/preset
        working-directory: packages/preset
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@tirox-ui/preset@$version" version >/dev/null 2>&1; then
            echo "@tirox-ui/preset@$version is already published"
          else
            npm publish --provenance --access public
          fi

      - name: Publish @tirox-ui/solid
        working-directory: packages/solid
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@tirox-ui/solid@$version" version >/dev/null 2>&1; then
            echo "@tirox-ui/solid@$version is already published"
          else
            npm publish --provenance --access public
          fi
